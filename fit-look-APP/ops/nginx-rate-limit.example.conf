# FitLook origin-proxy rate limits. Put this in the Nginx http {} block and
# apply the locations inside the API server block.

limit_req_zone $binary_remote_addr zone=fitlook_api:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=fitlook_otp:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=fitlook_ai:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=fitlook_tryon_image:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=fitlook_tryon_video:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fitlook_uploads:10m rate=40r/h;

server {
  # server_name api.fitlook.example;

  location /api/auth/otp/send {
    limit_req zone=fitlook_otp burst=2 nodelay;
    proxy_pass http://fitlook_node;
  }

  location ~ ^/api/(recommendations/(studio-chat|stylist-chat)|products/amazon-search)$ {
    limit_req zone=fitlook_ai burst=4 nodelay;
    proxy_pass http://fitlook_node;
  }

  location ~ ^/api/tryons/[^/]+/video$ {
    limit_req zone=fitlook_tryon_video burst=3 nodelay;
    proxy_pass http://fitlook_node;
  }

  location /api/tryons {
    limit_req zone=fitlook_tryon_image burst=5 nodelay;
    proxy_pass http://fitlook_node;
  }

  location ~ ^/api/(auth/(profile|body-photo)|closet/items(|/analyze))$ {
    limit_req zone=fitlook_uploads burst=5 nodelay;
    client_max_body_size 10m;
    proxy_pass http://fitlook_node;
  }

  location /api/ {
    limit_req zone=fitlook_api burst=30 nodelay;
    proxy_pass http://fitlook_node;
  }
}
