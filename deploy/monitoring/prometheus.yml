global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lookmefy-api
    metrics_path: /api/metrics/prometheus
    scheme: https
    static_configs:
      - targets:
          - api.lookmefy.in
    authorization:
      type: Bearer
      credentials: "${METRICS_BEARER_TOKEN}"
